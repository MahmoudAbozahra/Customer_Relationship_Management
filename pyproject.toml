[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["web_app/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django ModelForm metadata uses class-level lists by design.
"web_app/forms.py" = ["RUF012"]
# Django's declarative model ordering is conventionally a class-level list.
"web_app/models.py" = ["RUF012"]
# Keep the existing Django project package name for compatibility.
"main_CRM/__init__.py" = ["N999"]

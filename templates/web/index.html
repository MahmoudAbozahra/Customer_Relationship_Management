{% extends "base.html" %}
{% block content %}
<section class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h1 class="display-5">Django CRM</h1>
      <p class="lead mb-4">Manage client records and their categories.</p>
      {% if user.is_staff %}
        <a href="{% url 'dashboard' %}" class="btn btn-primary">Open dashboard</a>
      {% elif user.is_authenticated %}
        <p class="text-muted">Client records are available to staff accounts.</p>
      {% else %}
        <a href="{% url 'register' %}" class="btn btn-primary">Create an account</a>
        <a href="{% url 'my_login' %}" class="btn btn-outline-primary">Sign in</a>
      {% endif %}
    </div>
  </div>
</section>
{% endblock content %}
